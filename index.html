<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>150K GAME</title>
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="game">
  <header class="header">
    <div><span class="logo">150K</span><div><b>WEB DESIGN GAME</b><small>90 DAYS</small></div></div>
    <button id="resetBtn" class="ghost" type="button">↺</button>
  </header>

  <section class="hero">
    <div class="level-row"><span id="dayLabel">DAY 1 / 90</span><span id="levelLabel">LEVEL 1 · 0 XP</span></div>
    <h1>Твой путь к <em>150 000 ₽</em></h1>
    <div class="money"><span id="money">0 ₽</span><span>из 150 000 ₽</span></div>
    <div class="progress"><i id="moneyProgress"></i></div>
    <div class="stats">
      <div><b id="xp">0</b><span>XP</span></div>
      <div><b id="streak">0</b><span>дней подряд</span></div>
      <div><b id="done">0</b><span>задач</span></div>
    </div>
  </section>

  <section class="today">
    <div class="section-head"><div><span class="eyebrow">СЕГОДНЯ</span><h2>Мои задачи</h2></div><span id="taskCount" class="count">0 / 0</span></div>
    <form id="taskForm" class="add-task">
      <input id="taskInput" maxlength="100" autocomplete="off" placeholder="Что нужно сделать?" aria-label="Новая задача">
      <button type="submit">Добавить</button>
    </form>
    <div id="tasks" class="tasks"></div>
  </section>

  <section class="calendar">
    <div class="section-head"><div><span class="eyebrow">90 ДНЕЙ</span><h2>Прогресс</h2></div><span id="calendarPercent" class="count">0%</span></div>
    <div id="days" class="days"></div>
  </section>

  <section class="rules">
    <div><b>Как играть</b><span>Выполняй задачи → получай XP → прокачивай уровень → двигайся к 150K.</span></div>
    <div><b>+10 XP</b><span>За каждую выполненную задачу.</span></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
